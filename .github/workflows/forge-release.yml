# Forge owns this file. Do not edit.
name: Forge release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Qualified full commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate full commit ID
        env:
          FORGE_COMMIT_SHA: ${{ inputs.commit }}
        run: '[[ "$FORGE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]'
        shell: bash
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - validate-commit
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: Create isolated toolchain directory
        env:
          FORGE_TOOLCHAIN: eyJidW4iOiIxLjQuMiIsImFxdWE6Z2l0bGVha3MvZ2l0bGVha3MiOiI4LjMwLjEiLCJub2RlIjoiMjIuMjMuMiIsImFxdWE6Z29vZ2xlL29zdi1zY2FubmVyIjoiMi42LjAiLCJhcXVhOmFuY2hvcmUvc3lmdCI6IjEuNTQuMSJ9
        run: "node -e 'const fs = require(\"node:fs\"); const path = require(\"node:path\"); const tools = JSON.parse(Buffer.from(process.env.FORGE_TOOLCHAIN, \"base64\").toString()); const dir = path.join(process.env.RUNNER_TEMP, \"forge-toolchain\"); fs.mkdirSync(dir, { recursive: true }); fs.writeFileSync(path.join(dir, \"mise.toml\"), \"[tools]\\n\" + Object.entries(tools).sort(([a], [b]) => a.localeCompare(b)).map(([name, version]) => JSON.stringify(name) + \" = \" + JSON.stringify(version)).join(\"\\n\") + \"\\n\");'"
      - name: Set up accepted toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.12
          cache: false
          add_shims_to_path: false
          working_directory: ${{ runner.temp }}/forge-toolchain
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/forge-toolchain/mise.toml
          MISE_NO_AUTO_INSTALL: "1"
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/forge-toolchain
      - name: "prepare: cli: cli.format-check"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.lint"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.type-check"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.unit"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.coverage"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.code-scan"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.boundary"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.build"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: "prepare: cli: cli.dependency-scan"
        run: node .forge/ci/run-command.mjs prepare
        env:
          FORGE_CI_COMMAND: 
          FORGE_CI_PROFILE: prepare
      - name: Retain scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forge-release-prepare
          path: .forge/ci-evidence/reports/
          if-no-files-found: ignore
          retention-days: 7
